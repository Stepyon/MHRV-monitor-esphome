<text x="65" y="561" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#3c5a70">Use waterproof probes;</text>
<text x="65" y="585" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#3c5a70">keep PCB and splices dry.</text>
<text x="65" y="612" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#3c5a70">No 5 V on GPIO pins.</text>
<rect x="60" y="690" width="1370" height="77" rx="14" fill="#edf4fa" stroke="#9bb8ce" stroke-width="2"/>
<text x="80" y="718" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#1a4261" font-weight="bold">USB factory flashing: GPIO0 → GND only during boot</text>
<text x="81" y="744" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#345d7a">Unplug USB → connect a temporary GPIO0-to-GND jumper → plug USB in → flash → unplug → remove jumper → reconnect USB.</text>
<text x="1453" y="789" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#71869a" text-anchor="end">Functional circuit, not physical pin placement. Check board silkscreen.</text>
