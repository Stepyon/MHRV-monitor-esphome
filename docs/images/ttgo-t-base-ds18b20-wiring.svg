<rect x="440" y="213" width="91" height="29" rx="5" fill="white"/><text x="447" y="234" fill="#b02c37">3.3 V</text>
<rect x="440" y="316" width="93" height="29" rx="5" fill="white"/><text x="447" y="337" fill="#9c6e11">DATA</text>
<rect x="440" y="419" width="93" height="29" rx="5" fill="white"/><text x="447" y="440" fill="#455f7a">GND</text>
</g>
<!-- Single pull-up: VDD -> resistor -> Data -->
<path d="M560 247V274" stroke="#db464d" stroke-width="5"/>
<rect x="547" y="274" width="26" height="47" rx="4" fill="#fff9e8" stroke="#d48a26" stroke-width="3"/>
<path d="M560 321V350" stroke="#f1ae26" stroke-width="5"/>
