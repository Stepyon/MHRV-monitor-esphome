<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="800" viewBox="0 0 1490 800" role="img" aria-labelledby="title desc">
<title id="title">LILYGO TTGO T-Base with four DS18B20 sensors on GPIO4 and 4.7k pull-up</title>
<desc id="desc">Functional wiring schematic: all DS18B20 probes are wired in parallel with power VDD to 3V3, data to ESP8266 GPIO4 and ground to GND. A single 4.7 kiloohm resistor connects the 3V3 and data buses. For factory flashing, briefly connect GPIO0 to GND before connecting USB and remove that jumper before normal restart. Pin boxes show logical signals, not physical hole positions.</desc>
<rect width="1490" height="800" fill="#fff"/>
<text x="65" y="64" font-family="Arial,Helvetica,sans-serif" font-size="33" fill="#193b54" font-weight="bold">TTGO T-Base · four DS18B20 temperature probes</text>
<text x="66" y="103" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#5c7185">All probes share one GPIO4 data bus and one 4.7 kΩ pull-up resistor.</text>
<rect x="60" y="170" width="350" height="332" rx="22" fill="#185e9d" stroke="#0d3f71" stroke-width="4"/>
<rect x="80" y="190" width="310" height="45" rx="10" fill="#134a7c"/>
<text x="235" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="white" font-weight="bold">LILYGO TTGO T-Base</text>
<text x="235" y="274" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#e7f3ff" text-anchor="middle">ESP8266 · USB powered</text>
<text x="105" y="316" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#b8dcf6">Connect to marked PCB pins:</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="white" font-weight="bold">
<text x="128" y="358">3V3</text>
<text x="128" y="409">GPIO4 / “4”</text>
<text x="128" y="460">GND</text>
</g>
<g><circle cx="389" cy="247" r="12" fill="#db464d" stroke="white" stroke-width="4"/><circle cx="389" cy="350" r="12" fill="#f1ae26" stroke="white" stroke-width="4"/><circle cx="389" cy="453" r="12" fill="#506680" stroke="white" stroke-width="4"/></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#fff">
<text x="265" y="250">3V3</text><text x="250" y="352">GPIO4</text><text x="270" y="457">GND</text>
</g>
