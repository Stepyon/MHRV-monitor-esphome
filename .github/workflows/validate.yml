name: Validate and build ESPHome firmware
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ESPHome
        run: pip install 'esphome==2026.11.0'
      - name: Validate credential-free firmware
        run: esphome config mhrv-monitor.yaml
      - name: Test release-note formatting
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Compile factory and OTA images
        run: esphome compile mhrv-monitor.yaml
      - name: Verify binaries exist
        run: |
          test -n "$(find .esphome/build -name 'firmware.factory.bin' -print -quit)"
          test -n "$(find .esphome/build -name 'firmware.ota.bin' -print -quit)"
      - name: Smoke-test release packager and manifests
        run: |
          printf '* Synchronize MVHR efficiency readings by @dev in https://github.com/Stepyon/MHRV-monitor-esphome/pull/6\n' > /tmp/mhrv-release-notes-ci.md
          python scripts/package_release.py 0.1.0-ci /tmp/mhrv-release-notes-ci.md
          python -m json.tool site/firmware/manifest.json > /dev/null
          python -m json.tool site/firmware/manifest.web.json > /dev/null
          python - <<'PY'
          import json
          manifest = json.load(open("site/firmware/manifest.json"))
          ota = manifest["builds"][0]["ota"]
          assert "Synchronize MVHR efficiency readings (#6)" in ota["summary"]
          assert ota["release_url"].endswith("/releases/tag/v0.1.0-ci")
          assert len(ota["summary"]) <= 700
          PY
      - name: Stage test binaries outside ESPHome hidden build directory
        run: |
          mkdir -p test-binaries
          cp "$(find .esphome/build -name 'firmware.factory.bin' -print -quit)" test-binaries/
          cp "$(find .esphome/build -name 'firmware.ota.bin' -print -quit)" test-binaries/
      - name: Upload test binaries (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: mhrv-monitor-test-firmware
          path: test-binaries/
          if-no-files-found: error
