name: Validate and build ESPHome firmware
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ESPHome
        run: pip install 'esphome==2026.11.0'
      - name: Validate credential-free firmware
        run: esphome config mhrv-monitor.yaml
      - name: Compile factory and OTA images
        run: esphome compile mhrv-monitor.yaml
      - name: Verify binaries exist
        run: |
          test -n "$(find .esphome/build -name 'firmware.factory.bin' -print -quit)"
          test -n "$(find .esphome/build -name 'firmware.ota.bin' -print -quit)"
      - name: Stage test binaries outside ESPHome hidden build directory
        run: |
          mkdir -p test-binaries
          cp "$(find .esphome/build -name 'firmware.factory.bin' -print -quit)" test-binaries/
          cp "$(find .esphome/build -name 'firmware.ota.bin' -print -quit)" test-binaries/
      - name: Upload test binaries (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: mhrv-monitor-test-firmware
          path: test-binaries/
          if-no-files-found: error
