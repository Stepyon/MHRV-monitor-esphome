# MHRV monitor — shared, credential-free factory and OTA firmware
# ESPHome 2026.11.0 / ESP8266 D1 mini with 4x DS18B20
substitutions:
  device_name: mhrv-monitor
  friendly_name: MHRV Monitor
  firmware_version: "0.1.0"

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  project:
    name: stepyon.mhrv_monitor
    version: "${firmware_version}"
  on_boot:
    priority: -100
    then:
      - script.execute: temperature_polling_loop

esp8266:
  board: d1_mini
  restore_from_flash: true

logger:

# This API key is provisioned by Home Assistant after the initial setup.
# No global key is embedded in the public firmware.
api:
  encryption:

# Limit the unprovisioned device's enrollment window.
provisioning:
  timeout: 5min

# Public firmware updates use HTTP OTA. Do not add unencrypted native OTA:
# a runtime API key cannot be inherited as a native OTA key at compile time.
ota:
  - platform: http_request

# ESP8266 cannot verify remote TLS server certificates with ESPHome.
# Remote one-click firmware updates have a MITM risk; see README.
http_request:
  verify_ssl: false
  timeout: 20s
  tls_buffer_size_rx: 16384

update:
  - platform: http_request
    name: "MHRV Monitor Firmware"
    source: https://stepyon.github.io/MHRV-monitor-esphome/firmware/manifest.json
    update_interval: 6h
    entity_category: diagnostic

# No built-in Wi-Fi credentials: use captive portal / Improv Serial on first boot.
wifi:
  ap:
    ssid: "MHRV Monitor Setup"

captive_portal:

improv_serial:

one_wire:
  - platform: gpio
    pin: GPIO4
    id: temperature_bus

sensor:
  - platform: dallas_temp
    one_wire_id: temperature_bus
    index: 0
    id: temperature_1
    name: "Temperature 1"
    resolution: 12
    update_interval: never
    accuracy_decimals: 1
    filters: !include
      file: .temperature_filters.yaml
      vars:
        calibration_id: temperature_1_calibration
    # Notify the mapped virtual temperatures only when this physical probe
    # publishes a new (filtered) reading.
    on_value:
      then:
        - script.execute: refresh_air_temperatures

  - platform: dallas_temp
    one_wire_id: temperature_bus
    index: 1
    id: temperature_2
    name: "Temperature 2"
    resolution: 12
    update_interval: never
    accuracy_decimals: 1
    filters: !include
      file: .temperature_filters.yaml
      vars:
        calibration_id: temperature_2_calibration
    # Notify the mapped virtual temperatures only when this physical probe
    # publishes a new (filtered) reading.
    on_value:
      then:
        - script.execute: refresh_air_temperatures

  - platform: dallas_temp
    one_wire_id: temperature_bus
    index: 2
    id: temperature_3
    name: "Temperature 3"
    resolution: 12
    update_interval: never
    accuracy_decimals: 1
    filters: !include
      file: .temperature_filters.yaml
      vars:
        calibration_id: temperature_3_calibration
    # Notify the mapped virtual temperatures only when this physical probe
    # publishes a new (filtered) reading.
    on_value:
      then:
        - script.execute: refresh_air_temperatures

  - platform: dallas_temp
    one_wire_id: temperature_bus
    index: 3
    id: temperature_4
    name: "Temperature 4"
    resolution: 12
    update_interval: never
    accuracy_decimals: 1
    filters: !include
      file: .temperature_filters.yaml
      vars:
        calibration_id: temperature_4_calibration
    # Notify the mapped virtual temperatures only when this physical probe
    # publishes a new (filtered) reading.
    on_value:
      then:
        - script.execute: refresh_air_temperatures

  # Stable, duct-named virtual sensors. Assign the physical probes using
  # the four HA select entities below; no reflashing required.
  - platform: template
    name: "Outdoor Air"
    id: outdoor_air_temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const auto &probe = id(outdoor_air_probe).current_option();
      if (probe == "Probe 1") return id(temperature_1).state;
      if (probe == "Probe 2") return id(temperature_2).state;
      if (probe == "Probe 3") return id(temperature_3).state;
      if (probe == "Probe 4") return id(temperature_4).state;
      return NAN;
    # Republish on every routed update (including NAN to clear stale values).

  - platform: template
    name: "Supply Air"
    id: supply_air_temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const auto &probe = id(supply_air_probe).current_option();
      if (probe == "Probe 1") return id(temperature_1).state;
      if (probe == "Probe 2") return id(temperature_2).state;
      if (probe == "Probe 3") return id(temperature_3).state;
      if (probe == "Probe 4") return id(temperature_4).state;
      return NAN;
    # Republish on every routed update (including NAN to clear stale values).

  - platform: template
    name: "Extract Air"
    id: extract_air_temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const auto &probe = id(extract_air_probe).current_option();
      if (probe == "Probe 1") return id(temperature_1).state;
      if (probe == "Probe 2") return id(temperature_2).state;
      if (probe == "Probe 3") return id(temperature_3).state;
      if (probe == "Probe 4") return id(temperature_4).state;
      return NAN;
    # Republish on every routed update (including NAN to clear stale values).

  - platform: template
    name: "Exhaust Air"
    id: exhaust_air_temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const auto &probe = id(exhaust_air_probe).current_option();
      if (probe == "Probe 1") return id(temperature_1).state;
      if (probe == "Probe 2") return id(temperature_2).state;
      if (probe == "Probe 3") return id(temperature_3).state;
      if (probe == "Probe 4") return id(temperature_4).state;
      return NAN;
    # Republish on every routed update (including NAN to clear stale values).


  # Thermal recovery efficiencies, based on the configured duct temperatures.
  # Return NAN while a required probe is unassigned or unavailable.
  - platform: template
    name: "Supply Efficiency"
    id: supply_efficiency
    icon: "mdi:percent"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const float fresh = id(outdoor_air_temperature).state;
      const float supply = id(supply_air_temperature).state;
      const float extract = id(extract_air_temperature).state;
      if (isnan(fresh) || isnan(supply) || isnan(extract)) return NAN;
      const float delta = extract - fresh;
      if (fabsf(delta) <= 1.0f) return 0.0f;
      float efficiency = ((supply - fresh) / delta) * 100.0f;
      efficiency = fminf(100.0f, fmaxf(0.0f, efficiency));
      return roundf(efficiency * 10.0f) / 10.0f;

  - platform: template
    name: "Exhaust Efficiency"
    id: exhaust_efficiency
    icon: "mdi:percent"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const float fresh = id(outdoor_air_temperature).state;
      const float extract = id(extract_air_temperature).state;
      const float exhaust = id(exhaust_air_temperature).state;
      if (isnan(fresh) || isnan(extract) || isnan(exhaust)) return NAN;
      const float delta = extract - fresh;
      if (fabsf(delta) <= 1.0f) return 0.0f;
      float efficiency = ((extract - exhaust) / delta) * 100.0f;
      efficiency = fminf(100.0f, fmaxf(0.0f, efficiency));
      return roundf(efficiency * 10.0f) / 10.0f;


  # Remote OTA diagnostics: report flash capacity and available runtime RAM.
  # All diagnostic entities are read-only; none add saved preference slots.
  - platform: template
    name: "Flash Chip Size"
    icon: "mdi:memory"
    entity_category: diagnostic
    unit_of_measurement: "MB"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      return ESP.getFlashChipRealSize() / 1048576.0f;

  - platform: debug
    free:
      name: "Free Heap"
      entity_category: diagnostic
    block:
      name: "Largest Free Heap Block"
      entity_category: diagnostic
    fragmentation:
      name: "Heap Fragmentation"
      entity_category: diagnostic
    loop_time:
      name: "Main Loop Time"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: template
    name: "Operating Mode"
    id: operating_mode
    icon: "mdi:hvac"
    update_interval: never
    lambda: |-
      const float fresh = id(outdoor_air_temperature).state;
      const float supply = id(supply_air_temperature).state;
      const float extract = id(extract_air_temperature).state;
      const float exhaust = id(exhaust_air_temperature).state;
      // Unlike the original HA template, exhaust reads the Exhaust Air
      // temperature, not Extract Air for a second time.
      if (isnan(fresh) || isnan(supply) || isnan(extract) || isnan(exhaust))
        return {"Unknown"};
      const float delta = extract - fresh;
      const float delta_abs = fabsf(delta);
      if (delta_abs < 3.0f) return {"Neutral"};
      const float supply_transfer = fabsf(supply - fresh) / delta_abs * 100.0f;
      const float exhaust_transfer = fabsf(extract - exhaust) / delta_abs * 100.0f;
      if (supply_transfer < 30.0f && exhaust_transfer < 30.0f)
        return {"Bypass"};
      if (fresh < extract) return {"Heating"};
      return {"Cooling"};


  - platform: debug
    device:
      name: "Device Information"
      entity_category: diagnostic
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

debug:
  update_interval: 60s

script:
  - id: refresh_air_temperatures
    mode: restart
    then:
      - component.update: outdoor_air_temperature
      - component.update: supply_air_temperature
      - component.update: extract_air_temperature
      - component.update: exhaust_air_temperature
      # Recompute derived values after all four named temperatures are refreshed.
      - component.update: supply_efficiency
      - component.update: exhaust_efficiency
      - component.update: operating_mode

  - id: temperature_polling_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - component.update: temperature_1
            - component.update: temperature_2
            - component.update: temperature_3
            - component.update: temperature_4
            - delay: !lambda |-
                float seconds = id(temperature_polling_interval).state;
                if (isnan(seconds) || seconds < 1.0f) seconds = 5.0f;
                return (uint32_t) (seconds * 1000.0f);


# Each dropdown maps a named duct temperature to a physical 1-Wire probe.
# They are stored on the device and restored after restart or an OTA update.
# The defaults are only placeholders: assign the actual probes in Home Assistant.
select:
  - platform: template
    name: "Outdoor Air Probe"
    id: outdoor_air_probe
    icon: "mdi:swap-horizontal"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Unassigned"
    options:
      - "Unassigned"
      - "Probe 1"
      - "Probe 2"
      - "Probe 3"
      - "Probe 4"
    on_value:
      then:
        - script.execute: refresh_air_temperatures

  - platform: template
    name: "Supply Air Probe"
    id: supply_air_probe
    icon: "mdi:swap-horizontal"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Unassigned"
    options:
      - "Unassigned"
      - "Probe 1"
      - "Probe 2"
      - "Probe 3"
      - "Probe 4"
    on_value:
      then:
        - script.execute: refresh_air_temperatures

  - platform: template
    name: "Extract Air Probe"
    id: extract_air_probe
    icon: "mdi:swap-horizontal"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Unassigned"
    options:
      - "Unassigned"
      - "Probe 1"
      - "Probe 2"
      - "Probe 3"
      - "Probe 4"
    on_value:
      then:
        - script.execute: refresh_air_temperatures

  - platform: template
    name: "Exhaust Air Probe"
    id: exhaust_air_probe
    icon: "mdi:swap-horizontal"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Unassigned"
    options:
      - "Unassigned"
      - "Probe 1"
      - "Probe 2"
      - "Probe 3"
      - "Probe 4"
    on_value:
      then:
        - script.execute: refresh_air_temperatures

number:
  - platform: template
    name: "Temperature Polling Interval"
    id: temperature_polling_interval
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    entity_category: config
    min_value: 1
    max_value: 300
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
    on_value:
      then:
        - script.execute: temperature_polling_loop

  - platform: template
    name: "Temperature Smoothing Window"
    id: temperature_smoothing_window
    icon: "mdi:chart-bell-curve-cumulative"
    unit_of_measurement: "samples"
    entity_category: config
    min_value: 1
    max_value: 20
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 4

  - platform: template
    name: "Temperature Hysteresis"
    id: temperature_hysteresis
    icon: "mdi:swap-horizontal"
    unit_of_measurement: "°C"
    entity_category: config
    min_value: 0
    max_value: 0.05
    step: 0.01
    optimistic: true
    restore_value: true
    initial_value: 0.02

  - platform: template
    name: "Temperature 1 Calibration"
    id: temperature_1_calibration
    icon: "mdi:thermometer-plus"
    unit_of_measurement: "°C"
    entity_category: config
    min_value: -5
    max_value: 5
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Temperature 2 Calibration"
    id: temperature_2_calibration
    icon: "mdi:thermometer-plus"
    unit_of_measurement: "°C"
    entity_category: config
    min_value: -5
    max_value: 5
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Temperature 3 Calibration"
    id: temperature_3_calibration
    icon: "mdi:thermometer-plus"
    unit_of_measurement: "°C"
    entity_category: config
    min_value: -5
    max_value: 5
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Temperature 4 Calibration"
    id: temperature_4_calibration
    icon: "mdi:thermometer-plus"
    unit_of_measurement: "°C"
    entity_category: config
    min_value: -5
    max_value: 5
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 0

