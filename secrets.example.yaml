# Copy to secrets.yaml and replace ALL placeholders; never commit your secrets.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
# Generate a random 32-byte Base64 key using: openssl rand -base64 32
# For an EXISTING device, preserve its current API key instead.
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"
# At least 8 characters. This hotspot is for local Wi-Fi recovery.
fallback_ap_password: "REPLACE_WITH_STRONG_RANDOM_PASSWORD"
